name: artifacts

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      
      - run: dotnet restore LabCalc.slnx
      - run: dotnet build LabCalc.slnx -c ${{ matrix.configuration }} --no-restore
      
      - uses: actions/upload-artifact@v4
        with:
          name: lab-artifact-${{ matrix.configuration }}
          path: |
            **/bin/
            **/obj/
          retention-days: 14
